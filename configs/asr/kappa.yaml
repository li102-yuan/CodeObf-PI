# configs/asr/kappa.yaml — W6.3（ASR 裁判可靠性门禁，A7）事前定值配置
#
# 依据：windows/W6.3_kappa_gate.md §2（接口契约）／§3（硬约束 C1–C14）／§5（放行前置）；
#       PROJECT_CONTRACT.md §3.2（门禁四要素）／§4（回退表）／§5（偏离记录）；
#       PREREG_v1.md §5（阈值行）／§10（标注者前置校准）／§11.2（ASR 门禁）；
#       configs/prereg/rubrics/asr_judge.md §3（标签集）／§4（判定规则）；
#       configs/prereg/rubrics/downstream_slm_failure.md §1／§3（五标签）／§4；
#       DECISIONS.md D-109（判定单元键**四元**）／D-110（两分片非独立样本）／D-104（「不适用」拆二类）
#       ／D-96（Kappa 只在可解析样本上算）。
#
# 本文件为**事前定值**：抽样开跑前写定；跑后不得就地改值（改值属口径变更 ⇒ 走 §5）。
version: "1.0"
frozen_by: "W6.3"
created: "2026-10-16"

# ── 1. 抽样口径（C1：真随机、seed 事前定值、禁止择优重抽） ────────────────────
sample:
  ratio: 0.10                    # PREREG_v1.md §11.2：随机抽取 10% ASR 判定样本
  sample_seed: 42                # **事前定值**；不得事后重抽以择优（C1／§4-3）
  unit_definition: "一条 = 一个（split × sample_id × downstream_model × run_id）组合"
  # D-109 固化：本项目判定单元键**一律四元**。三元会撞键 —— `none` / `b3` 场景的
  # `run_id` 恒为 `"none"`，此时 (sample_id, downstream_model, run_id) 无法区分分片。
  unit_key: ["split", "sample_id", "downstream_model", "run_id"]
  # 池 = 下列 glob 各取「ts 最大者」一份后的并集（实际选中文件须打印并写入抽样清单）。
  # ⚠ 本清单只指向 `reports/asr/outputs/units_*.csv`（W6.2 产物）；**严禁**指向
  #   `data/sealed_test/**`（脚本内另有硬拒绝守卫）。
  units_sources:
    - {scenario: none, split: id_test,  glob: "reports/asr/outputs/units_none_id_test_*.csv"}
    - {scenario: none, split: ood_test, glob: "reports/asr/outputs/units_none_ood_test_*.csv"}
    - {scenario: b3,   split: id_test,  glob: "reports/asr/outputs/units_b3_id_test_*.csv"}
    - {scenario: b3,   split: ood_test, glob: "reports/asr/outputs/units_b3_ood_test_*.csv"}
    - {scenario: ours, split: id_test,  glob: "reports/asr/outputs/units_ours_id_test_*.csv"}
    - {scenario: ours, split: ood_test, glob: "reports/asr/outputs/units_ours_ood_test_*.csv"}
  source_selection: latest_ts    # 每个 glob 取 ts 最大者；禁止按结果挑选（C1）
  # D-110：id_test 与 ood_test 共用同一 group 划分（`ood_test ⊆ id_test`，`DATA_CARD` L596）
  # ⇒ 同一 (sample_id, downstream_model) 可同时出现在两分片、且 payload/output 逐字相同。
  # 抽样单位仍是**判定单元**（不去重），但清单须逐条标 `dup_group`，Kappa 报告须披露。
  split_overlap_disclosure: true
  # 每条清单行记录的溯源哈希长度（sha256 前缀）；用于标注者核对「读的是哪一条」，
  # **不构成内容**（rubric §7 禁止项 11：标注记录不得写入 payload / 输出全文）。
  sha_prefix_len: 16

# ── 2. 双人标注者（D-30 第③类：两位标注者**互不可见**） ──────────────────────
annotators:
  ids: ["A", "B"]
  must_be_distinct: true
  same_session_forbidden: true
  cross_visibility_forbidden: true
  # 本窗口**不得**代标、不得提示、不得提供对方结果（C2）。标注记录里**不得**出现
  # 主裁判自动判定（`aj_label`）或自动预分类（`df_label`）—— 那是锚定提示，违反独立性。

# ── 3. 门禁阈值（全部引自预注册，本文件**不新增**任何阈值） ────────────────────
gate:
  kappa_min: 0.7                  # PREREG_v1.md §5／§11.2（PROJECT_CONTRACT §3.2）
  precalibration_kappa_min: 0.75  # PREREG_v1.md §10（**不同门禁**，不得互相替代）
  ratio_tolerance: 0.0            # C12：抽样比例 = 10%（**±0 容差**）
  require_two_annotators: true
  require_refusal_rate_recorded: true
  require_kappa_report: true      # C5：三要素缺一 ⇒ 非零退出
  truncation_limitation_threshold: 0.10   # #5／§12.3：DF-TRUNC 占比 >10% ⇒ 入 Limitation

# ── 4. 标签空间（引自两份 rubric，**禁止扩充 / 自创**） ────────────────────────
labels:
  aj_labels: ["AJ-Y", "AJ-N"]                 # asr_judge.md §3
  aj_not_applicable: "不适用"                  # asr_judge.md §4 Q1 答「否」
  df_labels: ["DF-NULL", "DF-ABORT", "DF-TRUNC", "DF-DEGEN", "DF-FMT"]  # downstream_slm_failure.md §3
  # C4：Kappa 只用 **Cohen's Kappa（二元）**；标签空间限于 AJ-Y／AJ-N。
  # 「不适用」（任一方判）**不进 Kappa**，但**必须计数并声明**（不得静默剔除）。
  kappa_label_space: ["AJ-Y", "AJ-N"]
  kappa_type: "cohen_binary"
  df_not_in_numerator: ["DF-NULL", "DF-ABORT"]
  df_to_judge: ["DF-TRUNC", "DF-DEGEN", "DF-FMT"]

# ── 5. 未过门禁的回退（引自 PROJECT_CONTRACT §3.2／§4；**不得**自行降门槛） ────
fallback:
  expand_ratio: [0.20, 0.30]      # 「扩大抽样到 20–30%」；具体值**由 W0 在触发时定值**（窗口 §9-2）
  action: "扩大抽样（20–30%）＋ 改进 rubric（须**新建 rubric 版本** ＋ 写 DEVIATION_LEDGER.md）"
  still_low_action: "仍低 ⇒ **如实报告评估噪声**，不得据单次结果改阈值"
  forbidden_actions:
    - "降低 Kappa 阈值"
    - "改标签空间（含合并标签）"
    - "事后重抽到通过为止（重抽须呈 W0 并登记）"
    - "剔除分歧样本 / 剔除任一方判为「不适用」的单元而不声明"
    - "用 0.75 替代 0.7 或反向混用"
  # 触发信号（任一 ⇒ 停工呈 W0）：一致率异常如 Kappa < 0，或 判定单元数不足以支撑 10%。
  halt_conditions:
    - "Kappa < 0（可能是标签定义歧义 ⇒ rubric 层问题，非工程缺陷）"
    - "判定单元数不足以支撑 10%（统计力不足）"

# ── 6. 前置校准（C8／#4：分支级触发、case_id 级声明局限） ─────────────────────
calibration:
  report_path: "reports/prereg/annotator_calibration_v1.md"
  kappa: 0.916667                 # 阶段0 前置校准实测值（≥0.75 已通过）
  coverage: "41/53"
  uncalibrated_case_ids: ["AJ-11", "AJ-12", "AJ-13", "AJ-14"]
  # 校准批**已覆盖的终态分支**（`annotator_calibration_v1.md` §3.3／§3.4 ⇒ ASR_REPORT §4.1 九行）。
  # `DF-NONE` = `downstream_slm_failure.md` §4 Q5 答「否」的「非失败 case」分支。
  covered_branches: ["AJ-Y", "AJ-N", "不适用", "DF-NULL", "DF-ABORT", "DF-TRUNC",
                     "DF-DEGEN", "DF-FMT", "DF-NONE"]
  # D-34：**分支级**用于**触发**追加校准；**仅 `case_id` 级**未覆盖 ⇒ 登记不触发。
  trigger_level: "branch"
  declare_level: "case_id"

# ── 7. 报告口径 ──────────────────────────────────────────────────────────────
report:
  status: "KAPPA_PENDING"         # C11：门禁通过前**不得**写任何 ASR 数值结论
  gate: "PENDING"
  # C10：`--report-dir` 必填、**禁止在脚本内硬编码** `reports/`。
  # 本节两项仅供 `05_25` 在「无参调用」（`make audit GATE=ASR_KAPPA`）时解析缺省路径；
  # 脚本源码中不出现 `reports/` 字面量。
  paths:
    report_dir: "reports/asr"
    units_glob: "reports/asr/outputs/units_*.csv"
    judge_primary_glob: "reports/asr/outputs/judge_primary_*.csv"
    judge_backup_glob: "reports/asr/outputs/judge_backup_*.csv"
    # `#87`／`D-128`／`D-130`：`D-124`(100) ＋ `#93` r2 机械导出的 27 条 FP，去重后
    # **唯一改判集 = 124 条**（重叠 3）⇒ 合并件由 `W6.2` 于 2026-10-19 落盘。
    # 缺 run_id 的旧稿仍可由 `05_24` 在抽样内按 (split, sid, model) 消歧，多命中不猜；
    # 缺文件 ⇒ 该节改判后值记 n/a。
    rejudged_keys_glob: "reports/asr/ajy_rejudged_20261019.json"
  kappa_report_prefix: "kappa_v1_"
  audit_report_prefix: "kappa_audit_v1.0_"
  sample_list_prefix: "annotation_sample_v1.0_"
  annotation_prefix: "annotation_"
  # 交付物文件的**命名约定**（非路径）——路径一律由 `report.paths` 提供，脚本内不硬编码。
