# -----------------------------------------------------------------------------
# 10. 扫描上限与产物路径
# -----------------------------------------------------------------------------
scan:
  # `TheStack` 分片共 2 个；30000/分片时 G3-real 的候选不足（实测仅 674 < 810），
  # 故改为**整片读**（60000/分片）；CSN 侧同步放宽。产出的 `group_key` 仍由
  # sha256 定序后取前 N，故扩大扫描**只增可选池、不改选择规则**。
  thestack_records_per_shard: 60000
  csn_records_python: 100000
  csn_records_javascript: 60000
  # G3 真实编码串的分类器扫描上限（**每个 origin 各取**按 group key 的 sha256 定序后前 N 条）。
  # 理由：分类器要在全量候选上跑正则，实测 ~1.4 ms/文件；上限使该步骤有界且可复现。
  # 收紧 `banner` 的附加判据后（见运行报告 §9.2），高精度命中率实测 ≈ **1.0%**
  # ⇒ 60000 × 2 origin × 1.0% ≈ 1200 个候选，对 810 条需求有约 1.5 倍余量。
  g3_real_pool: 100000
  alpaca_rows: 52002          # Alpaca 全量行数（本配置对齐 `data/raw/Alpaca` 的实测行数）
  wikitext_lines: 300000

output:
  dir: data/interim/benign_G1_G2_G3/
  csv:
    G1: G1.csv
    G2: G2.csv
    G3: G3.csv
  guard_csv: benign_guard_check.csv
  # 门禁 4 的**人工复核**载体（补正轮 r3）：由复核者产出、本窗口**只读**。
  guard_review_csv: benign_guard_review.csv
  raw_acquisition_json: raw_acquisition.json
  report_json: benign_report.json
  smoke_subdir: smoke

# 良性 CSV 字段序（`V-9`；`windows/W3.5_benign.md` §3.1 固定）
csv_fields:
  - sample_id
  - benign_group_id
  - benign_set
  - source
  - source_item_id
  - encoding_type
  - carrier_type
  - host_context
  - g3_business_form
  # **r2.2.1 ⓒ 新增**：每条合成样本单独说明「该宿主为何需要该编码」。
  # 该字段不在 `windows/W3.5_benign.md` §3.1 的原始字段表内，系回退轮 r2 明令新增
  # （「写入 `g3_business_form` 之外的**新字段**，如 `business_necessity_evidence`」）。
  - business_necessity_evidence
  - text
  - label
