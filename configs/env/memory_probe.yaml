schema: codeobf-pi/memory-probe/v1
generated_by: W2.4
generated_at: 2026-09-30 12:05:00
gpu_total_mib: 8187

# 主档（9 个；`01_00 --suite all` 与 `--suite <族名>` 覆盖的正是这一组）
suites:
  - name: idle
    kind: baseline            # 不加载模型，仅 import torch 后采集（torch 侧计数基线）
  - name: load-1b
    kind: load
    model_key: llamaguard3-1b
    load: 4bit-nf4
  - name: infer-1b-512
    kind: infer
    model_key: llamaguard3-1b
    load: 4bit-nf4
    batch: 1
    seq_len: 512
  - name: load-8b
    kind: load
    model_key: llamaguard3-8b
    load: 4bit-nf4
  - name: infer-8b-256
    kind: infer
    model_key: llamaguard3-8b
    load: 4bit-nf4
    batch: 1
    seq_len: 256
  - name: infer-8b-512
    kind: infer
    model_key: llamaguard3-8b
    load: 4bit-nf4
    batch: 1
    seq_len: 512
  - name: train-1b-10step-b1
    kind: train
    model_key: llamaguard3-1b
    load: 4bit-nf4
    batch: 1
    grad_accum: 4
    seq_len: 512
    steps: 10
    lora: {r: 16, alpha: 32, target_modules: [q_proj, v_proj]}
  - name: train-1b-10step-b4
    kind: train
    model_key: llamaguard3-1b
    load: 4bit-nf4
    batch: 4              # v5 L434 正式训练配置；本机 8GB 可能 OOM —— 探针的目的即判定此点
    grad_accum: 4
    seq_len: 512
    steps: 10
    lora: {r: 16, alpha: 32, target_modules: [q_proj, v_proj]}
  - name: unplug-cpu
    kind: infer
    model_key: unplug-tiny
    load: cpu-fp32        # v5 L122：CPU 推理
    batch: 1
    seq_len: 512

# 回退档（**仅当对应主档 OOM 时测**；测了才写入记录。对应关系见各档末行注释）
fallback_suites:
  - name: infer-8b-256-offload      # ← 对应主档 infer-8b-256（v5 回退阶梯：batch 1 → seq 256 → CPU offload）
    kind: infer
    model_key: llamaguard3-8b
    load: 4bit-nf4-offload-cpu
    batch: 1
    seq_len: 256
  - name: train-1b-10step-b1-offload  # ← 对应主档 train-1b-10step-b1（若 b1 亦 OOM 则测；亦作 b4→b1→offload 阶梯的末级）
    kind: train
    model_key: llamaguard3-1b
    load: 4bit-nf4-offload-cpu
    batch: 1
    grad_accum: 4
    seq_len: 512
    steps: 10
    lora: {r: 16, alpha: 32, target_modules: [q_proj, v_proj]}

thresholds:
  headroom_warn_mib: 1024     # 峰值距 gpu_total_mib 余量低于此值 ⇒ 判定「触顶风险」，须给回退档建议
