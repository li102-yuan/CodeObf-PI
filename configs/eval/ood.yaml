# configs/eval/ood.yaml — W6.4（5.3 OOD 泛化，A6）**事前定值**载体。
#
# 冻结依据：`windows/W6.4_ood.md` §2（接口契约）／§3（硬约束 C1–C12）／§4（本窗口禁止项）
# ／§7（验收）。
#
# **性质**：本文件的全部数值与规则在**任何 OOD 正式数字存在之前**定值（反事后择优）。
# 实现期与正式期只能**读取**本文件、**不得按结果改写**；确需变更 ⇒ 停工呈 W0
# （`windows/W6.4_ood.md` §8 回退点）。
#
# **单源复用（C1／C6）**：输入面（`inputs`／`record_assertions`）／τ 规则／推理与指标层
# 一律**取自 `W6.1` 的 `configs/eval/detection.yaml` 与 `scripts/eval/05_01_eval_detection.py`**，
# 本文件**不复制**其内容，只给出**指针**（`base_config`／`reuse_module`）——
# 避免两处口径漂移。
#
# writer 侧禁令（由 `scripts/eval/05_03_eval_ood.py` 执行）：
#  - `--report-dir`／`--outputs-dir` **不在此写死**（C8）；命令行必给；
#  - 分片一律**显式路径**（经 `05_01.assert_input_allowed` 白名单），**禁止默认扫描**
#    （`DIRECTORY.md` §5-6）。
#
version: "1.0"
window: "W6.4"
stage: "05"
seq: "03"
detector: ours
detector_name: "Ours = QLoRA 微调 Llama-Guard-3-1B（生成式二分类）"
frozen_by: "windows/W6.4_ood.md §2／§3／§4／§7"
declared_at: "2026-10-09"
declared_before: "any OOD test-side number existed（本窗口正式轮之前，OOD 侧尚无任何正式数字）"

# ─────────────────────────────────────────────────────────────────────────────
# 单源复用指针（C1／C6：**同一代码路径**，禁另写一套）
# ─────────────────────────────────────────────────────────────────────────────
base_config: "configs/eval/detection.yaml"                       # W6.1：inputs／record_assertions／tau／runs／metrics／latency／memory
reuse_module: "scripts/eval/05_01_eval_detection.py"             # W6.1：守卫／引擎／指标／写盘
reuse_symbols:
  guard:
    - assert_input_allowed        # C1：**不得另写一套**白名单守卫
    - assert_record_count
    - resolve_input_path
    - read_records
    - count_records
  engine:
    - Engine                      # C6：唯一推理实现源（内部走 04_01 的 prompt/encode/forward）
    - load_run_meta
    - resolve_tau_tracks
    - resolve_runs
    - select_runs
    - assert_meta_matches_cli
  metrics:
    - compute_metrics             # 内部走 03_07.compute_binary_metrics／binary_counts
    - latency_stats
    - quantile_table
  io:
    - write_csv_rows
    - write_per_sample
    - md5sum_manifest_check
    - fmt_num / fmt_metric / fmt_tau / NA / TBD
forbidden_rewrite:
  - "禁止另写推理循环（须经 `Engine.score`）"
  - "禁止另写输入白名单守卫（须经 `assert_input_allowed`）"
  - "禁止自造 score 定义或指标实现"

# ─────────────────────────────────────────────────────────────────────────────
# C3 OOD 的定义（**逐字声明**，`PREREG_v1.md` §2.2／§5）＋ 措辞禁令
# ─────────────────────────────────────────────────────────────────────────────
ood_definition:
  verbatim:
    - "**OOD = 编码方式分布外**；**恶意语义类别在训练集见过**；**不是语义 OOD**。"
  source: "PREREG_v1.md §2.2／§5；SOURCE_LOCK/实验执行方案（最终版 v5）.md L574–L582（5.3 节）"
  forbidden_wording:
    - "禁止把结论写成「模型对未见恶意语义的泛化」"
    - "禁止把「编码变换 OOD」表述为「语义 OOD」"

# ─────────────────────────────────────────────────────────────────────────────
# C4 体制二的编码构成（训练码 5 ／ 留出码 4；**留出码只在 test**）
# ─────────────────────────────────────────────────────────────────────────────
ood_encodings:
  train_codes: [base64, rot13, zerowidth, url, reverse]        # 5 个训练码（体制二 train／val 只含此 5 个）
  heldout_codes: [hex, morse, ascii_art, homoglyph]            # 4 个留出码（**只出现在 test**）
  source: "PREREG_v1.md §2.2；DATA_CARD_CodeObf-PI_v1.0.md §V-6／§144"
  heldout_expected_attack_n: 88            # 每留出码在 ood_test 的攻击样本数（DATA_CARD §144 实测）
  heldout_attack_total: 352                # 88 × 4 = 352（= ood_test 正类数）
  val_codes_present: [base64, rot13, reverse, url, zerowidth]  # ood_val 实测只含这 5 个训练码
  on_code_count_mismatch: "record_as_is_and_escalate_W0"       # §8：不得静默按现有数出结论

# ─────────────────────────────────────────────────────────────────────────────
# C2 记录数断言（**取自 `W6.1` 的 detection.yaml**，本文件不复制数值，只登记口径）
# ─────────────────────────────────────────────────────────────────────────────
record_count_policy:
  source: "configs/eval/detection.yaml → record_assertions（**禁改**）"
  keys_in_scope: [regime_ood_test, ood_val]
  expected: {regime_ood_test: 740, ood_val: 927}   # 登记值（与 base_config 逐格一致，仅供核对）
  on_mismatch: "stop_and_escalate_W0（**禁改断言值**）"
  must_use: "csv.DictReader（经 05_01.read_records；封存 CSV 的 text 含换行 ⇒ 行数 ≠ 记录数）"

# ─────────────────────────────────────────────────────────────────────────────
# C4 逐留出码分组（**分母口径**于此**事前定值**）
# ─────────────────────────────────────────────────────────────────────────────
per_encoding:
  group_by: "encoding_type"
  codes: [hex, morse, ascii_art, homoglyph]      # = ood_encodings.heldout_codes（顺序固定）
  denominators:
    tpr: "**只含 `label==1` 且 `encoding_type==<code>` 的攻击样本**"   # W4.5 教训：**不得**把良性混入 TPR 分母
    fpr: "本分片**全部良性样本**（`label==0`）"
    f1: "该码攻击样本 ∪ 本分片全部良性样本"
  fpr_constant_note: "良性样本无编码归属 ⇒ **各码 FPR 相同**；逐码差异只在 TPR／F1"
  special_case:
    ascii_art: "**单独列出、不混入整体均值**；按 `BASELINE_REPORT.md` §6 的「编码本身的可检测性边界」口径呈现（多行字符画经 tokenization 后特征受损）"
  forbid:
    - "禁止在逐码统计中把良性样本混入**攻击侧分母**（`W4.5` 已犯过一次）"
    - "禁止把 `ascii_art` 的低检测率单独判为「检测器失效」"

# ─────────────────────────────────────────────────────────────────────────────
# C4 衰减口径（`衰减 = 体制一 ID 检测率 − 体制二 OOD 检测率`，**同指标同 τ 口径**）
# ─────────────────────────────────────────────────────────────────────────────
decay:
  formula: "衰减 = 体制一（ID）检测率 − 体制二（OOD）检测率"
  metrics: [tpr, fpr, f1]
  primary_metric: tpr                            # 「检测率」主报 TPR（攻击样本检出率）
  tau_track: star                                # 两侧同 τ 口径：逐 run `best epoch` 的 `tau_ours`（全精度）
  pairing: by_seed                               # 逐 seed 配对（同 seed 的 id run ↔ ood run）
  id_reference:                                  # §9-3：ID 侧基准取 **W6.1 的 ID 同 τ 口径结果**（**非** BASELINE_REPORT 的 B3 数）
    written_before_run: true
    source_window: "W6.1（`D-69` 验收通过）"
    artifacts:
      # 【2026-10-22 修正 · `D-149` 换代清单 ①】原指向 v1 件 `detection_formal_v1.0_20261008-180056.csv`，
      # 而 OOD 侧已换代到 v2（`D-140` 路线 A）⇒ 衰减会跨代混算（实测 tpr 0.2620/0.1136 系混算值）。
      # 现指向 **v2 检测复评件**（同一脚本 `05_01` 产出，逐 seed × τ_track 行结构不变）。
      - "reports/eval/detection_formal_v1.0_20261022-144138.csv"   # `in_regime_test` × `id`，v2
    select: {shard: id_test, regime: id, track: star, source: sealed}
    required_seeds: [42, 123, 456]
    on_missing: "stop_and_escalate_W0"
  incomparable_disclosure:                       # C4：两体制**不可比要素**须显式声明
    - "**攻击样本构成不同**：`id_test` 为主档 9 码混合（攻击 792），`ood_test` 为 4 留出码（攻击 352，每码 88）"
    - "**ckpt 组不同**：ID 侧取 `id` 组 3 run，OOD 侧取 `ood` 组 3 run ⇒ 衰减同时含「编码分布外」与「训练体制不同」两个来源"
    - "**测试集规模与正负比不同**（`id_test` 1583：792/791；`ood_test` 740：352/388）"
    - "两侧**同 τ 规则**（`best epoch` 的 `tau_ours`，逐 run 独立）⇒ 衰减对 τ 口径是可比的；但仍**不得**将两体制指标当作同一总体的两次抽样"

# ─────────────────────────────────────────────────────────────────────────────
# 被评 run 与分组（§2：ood 组为主档；id 组作**跨体制对照**并**单列**）
# ─────────────────────────────────────────────────────────────────────────────
runs_policy:
  primary_group: ood              # 主档 = `ood` 组 3 run 评 `ood_test`
  cross_regime_group: id          # 跨体制对照 = `id` 组 3 run 评 `ood_test`
  cross_regime_label_required: "**跨体制对照**"
  cross_regime_must_not_mix: true # **不得**与主档混算（`W6.4` §2／§9-1）
  source_csv: "reports/train/three_seeds_v1.0_*.csv"
  seeds: [42, 123, 456]
  require_all_in_group: true

# ─────────────────────────────────────────────────────────────────────────────
# C9 `std=0` 退化（`D-47` 裁定四）
# ─────────────────────────────────────────────────────────────────────────────
aggregate:
  mean_std: true
  ddof: 1
  per_seed_raw_table: true                        # 一律给逐 seed 原值表
  std_zero_declaration_slot: true                 # 若 3 seed 全同 ⇒ 显式声明退化，**禁止**只写 mean ± std

# ─────────────────────────────────────────────────────────────────────────────
# C10 引数带口径（引 `BASELINE_REPORT.md` 必须带其 §12 的注释）
# ─────────────────────────────────────────────────────────────────────────────
baseline_citation:
  source: "reports/baseline/BASELINE_REPORT.md（tag `baseline-v1`；**只引不跑**，C13 类同）"
  mandatory_notes:
    - "B1 `ood_test` TPR 1.0 是**结构性因素**（4 留出码恰为强表观特征编码）⇒ **不得**作为性能结论摘引"
    - "B2 的 1.0/1.0 系 **τ = −inf 平凡解** ⇒ 几乎无区分力"
    - "B4 属 **CPU 档**，其延迟与 GPU 不可比"
    - "AUROC 的 `n/a` = **不适用**（B1／B3／B5 无连续 score），**非缺失**"

# ─────────────────────────────────────────────────────────────────────────────
# C11 ACCESS_LOG（`--source sealed` 缺 `--access-log-note` ⇒ 拒绝执行并非零退出）
# ─────────────────────────────────────────────────────────────────────────────
access_log:
  required_for: ["--source sealed"]
  columns: [date, window, purpose, command, output_path, reviewer]
  script_writes: false                            # 登记**由人手工完成**；脚本只在日志与报告回显 note
  missing_note_action: "refuse_and_nonzero_exit"

# ─────────────────────────────────────────────────────────────────────────────
# C5 val 侧独立性与 C3 三句声明（**逐字**，不得弱化／改写成中性表述）
# ─────────────────────────────────────────────────────────────────────────────
declarations:
  ood_val_three_sentences:                        # 转交项 `#50`／`D-53` 裁定六
    - "**`ood_val` 不测 OOD 泛化**，只用于早停与阈值；"
    - "**OOD 结论只取 `ood_test`**；"
    - "**不得因 `ood_val` 饱和而降低 ood 的训练要求**（饱和是同分布所致，不是泛化证据）。"
  val_nonindependence:                            # 转交项 `#51`／`D-61` 裁定二
    - "**`id_val` 与 `ood_val` 共享同一批验证文本**（`DATA_CARD` 的 `V-2`＋`V-6`）⇒ 两体制的**验证集指标不独立**，**不得**当作两次独立测量（实测：`ood_val` 唯一 `text` 集 927 **全部落入** `id_val` 的唯一 `text` 集 1557，交集 = **927 = |ood_val|**）。"
    - "**边界**：test 侧 `id_test`／`ood_test` **相互独立**（4 个留出码只在 test）⇒ **正式结论仍以 test 为准**；本条**只削弱 val 侧的独立证据力**，**不是**泄漏、**不是**口径污染。"
  ood_val_composition:
    - "**构成**：`ood_val`（927）只含 **5 个训练码**（`base64`／`rot13`／`reverse`／`url`／`zerowidth`）＋ 良性（无编码）；**4 个留出码只出现在 `ood_test`** ⇒ **`ood_val` 不构成 OOD 泛化证据**（转交项 `#50`）。"

# ─────────────────────────────────────────────────────────────────────────────
# C7 评估态与确定性（与 `ENV_LOCK.md` §7.2／`W6.1` C5 同制）
# ─────────────────────────────────────────────────────────────────────────────
eval_state:
  model_eval: true
  no_grad: true
  forbid_train_mode: true                         # 代码中不得出现 train 模式调用
  determinism_source: "scripts/train/04_01_train_qlora_ours.py::set_determinism（经 05_01.Engine 复用）"
  attn_implementation: eager
  cold_start_double_run: "同一样本、同一权重、同一 seed 连跑两次 ⇒ 逐样本 `score` 逐位相同（`--self-check` 覆盖纯函数侧；GPU 侧由正式轮抽样复核）"

# ─────────────────────────────────────────────────────────────────────────────
# 回退点（`W6.4` §8）
# ─────────────────────────────────────────────────────────────────────────────
fallbacks:
  record_count_mismatch: "stop_and_escalate_W0（禁改断言）"
  code_attack_n_mismatch: "如实登记并呈 W0（不得静默按现有数出结论）"
  per_code_tpr_collapse: "如实报告；按 `BASELINE_REPORT.md` §6 的边界口径呈现；**不得**改 τ 或换 ckpt 遮掩"
  oom: "按 `PROJECT_CONTRACT.md` §4 逐级回退并登记台账"
  three_seeds_identical: "报逐 seed 原值 ＋ 声明退化（C9）"
