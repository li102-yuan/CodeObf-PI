#   **不得**伪造 A／B 组数字、**不得**用 C 组结果冒充 A／B。
#
# ✅ **完整轮（2026-10-11 起）**：上段为**实现轮的历史前置**，已失效 —— A／B 组 ckpt 由
#   `W5.6`（A5）补训产出并验收通过（`D-91` 裁定一，tag `train-ab-v1`）⇒ 四组齐备。
#   本轮全部补记见上方 `full_round_amendments`（**判据数值与口径一律未改**）。
#
# **单源复用**：输入面（`inputs`／`record_assertions`）／τ 规则／推理与指标层
# 一律**取自 `W6.1` 的 `configs/eval/detection.yaml` 与 `scripts/eval/05_01_eval_detection.py`**，
# 本文件**不复制**其内容，只给出**指针**（`base_config`／`reuse_module`）——避免两处口径漂移。
#
# writer 侧禁令（由 `scripts/eval/05_06_eval_ablation.py` 执行）：
#  - `--report-dir`／`--outputs-dir` **不在此写死**（C9）；命令行必给；
#  - 分片一律**显式路径**（经 `05_01.assert_input_allowed` 白名单），**禁止默认扫描**
#    （`DIRECTORY.md` §5-6）。
