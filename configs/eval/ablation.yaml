# ─────────────────────────────────────────────────────────────────────────────
# **`#69` 区分度判据（`D-88` 裁定一，事前定值；`W6.7` 完整轮必办）**
# ─────────────────────────────────────────────────────────────────────────────
# ⛔ **红线（`D-88` 裁定三，三条）**：① 不得因「区分度不足」改训练口径；
#   ② 不得改判据本身（含放宽 `ε`／换指标／换分片／换 τ 档）；③ 不得选择性报告。
#   判据一旦落盘即为定值 —— 本块**只可被读取，不得按结果改写**。
discrimination:
  mandate: "转交项 `#69`（`D-88` 裁定六）⇒ `W6.7` 完整轮出数后**逐条执行** `D-88` 裁定一"
  decided_at: "2026-10-10（**早于** `W6.7` 完整轮的任何评估数字 ⇒ 属**事前定值**，`D-88` 〇）"
  eps: 0.01                        # `D-88` 裁定一 ③：`ε = 0.01`（1 个百分点）
  eps_rationale: "`id_test` 的 F1 已在 `1.0000` 附近饱和，`±0.01` 是 n=1583 规模下肉眼与统计上均不构成可声称差异的保守带；同一 `ε` 覆盖 FPR，避免「F1 饱和掩盖 FPR 差异」"
  groups_in_scope: [A, B, C]       # `D-88` ①：A／B／C 三组（**不含 D** —— D 与 C 同 ckpt，恒无差异）
  metrics: [f1, fpr]               # `D-88` ①(a)(b)：`id_test` 的 **F1** 与 **FPR**
  tracks: [star, fixed050]         # `D-88` ②「越档」：两个 τ 档**任一档**出现 ≥ε 差异 ⇒ 即认定有区分度
  rule_main: "`id_test` 主判据 = 同 τ 档内，**同时**满足 (a) 三组 F1 的 3-seed `mean` 极差 < ε **且** (b) 三组 FPR 的 3-seed `mean` 极差 < ε"
  rule_scope: "判「整体有区分度」的证据**不限于** `id_test`：`g3_hard_negative_test` 的 FPR 三组 `mean` 极差 ≥ ε ⇒ 即认定有区分度；`clean_original_test`（归 `04_04`／`W6`）同"
  rule_combined: "**仅当**「`id_test` 主判据成立（两个 τ 档均成立）」**且**「② 各项**均无** ≥ ε 的差异」时 ⇒ 判「**`id` 体制消融无区分度**」"
  verdict_is_trigger: "判「无区分度」是**触发条件、不是结论** ⇒ 须**呈 `W0`** 申请扩 `ood` 消融（`D-88` 裁定二：A／B 各 3 seeds ≈ **27 h**，`D-91` 裁定二 工时实测刷新；**须用户明批**，本窗口**不得**自行扩训）"
  # ⚠ **`judgment_shards` —— `rule_main`／`rule_scope` 的「结构化表述」**（**数值与口径未变**，
  #   只是把 §二 已写死的「分片 × 指标」格位集改成**机器可判读**形态）。
  #   **补记时点 = 2026-10-11，早于任何 `--source sealed` 的消融数字**
  #   （既有 `ablation_dryrun_val_*` 为 `--source val` 演练稿、非权威）⇒ **不构成事后择优**（`D-88` 裁定三）。
  #   为何必须有：判据的「格位集」若跟着**当前跑到哪个分片**走，则
  #     ① 跑 `g3_hard_negative_test` 那一轮会**只看到 `g3`**（裁定一① 的 `id_test` 主判据**整条缺**）；
  #     ② 跑 `in_regime_test` 那一轮若 companion 未就绪，会把「**未看 `g3`**」误判成「**无区分度**」
  #        ⇒ **假触发** `D-88` 裁定二（属「换分片」类错误，`D-88` 裁定三-2 明禁）。
  #   ⇒ 故格位集**与跑到哪个分片无关**；数据两处皆无 ⇒ 渲染 `<TBD>` ＋ 标「待 companion 轮」，
  #     并计为**待判读**；**存在待判读格位时不得判「无区分度」**。
  judgment_shards:
    - {shard: "id_test",               metrics: [f1, fpr], role: "main"}   # 裁定一 ①(a)(b)
    - {shard: "g3_hard_negative_test", metrics: [fpr],     role: "scope"}  # 裁定一 ②（全负分片 ⇒ 只取 FPR）
  judgment_shards_note: "`clean_original_test` **不列入**本集合 —— 归 `04_04`／`W6`，已由 `not_evaluated` 如实登记 ⇒ 综合判定**不覆盖**该项，且**不因该项缺失而阻断**结论。"
  pending_blocks_no_diff: true     # 存在待判读格位 ⇒ **不得**判「无区分度」（防「换分片」式假触发）
  not_evaluated:                   # **如实登记**未能纳入的判据项（`D-88` ②）
    - "`clean_original_test`（44）⇒ 归 `04_04`／`W6` 的 A6 侧，**本窗口不评估**（`W6.1` §1.3 同型：避免两处口径打架）⇒ 该项**未纳入**判定，须由 `04_04` 结果补齐"
  companion:                       # 跨分片取数（`05_03` 的 `decay.id_reference.artifacts` 同型机制）
    written_before_run: true       # 指针在**该轮起跑前**落盘（指向已产出的他分片 CSV），非事后填数
    written_at: "2026-10-11T08:45+08:00（`in_regime_test` 轮**起跑前**；指向同轮先跑完的 `g3` 轮权威产物 ts `20261011-083600`）"
    artifacts:
      - "reports/eval/ablation_v1.0_20261011-083600.csv"   # g3 轮（`--split g3_hard_negative_test`）消融表
    select_fields: [group, regime, seed, shard, tau_track, tpr, fpr, f1, auroc]
    on_missing: "另一分片的格位渲染 `<TBD>` 并显式标注「待 companion 轮」⇒ **不得**静默当作 0"
    regime_layer_required: true    # ⚠ `g3` 分片在 `id`／`ood` 下**指同一份 CSV** ⇒ 取数必须先按 `regime` 分层、再按 seed 去重，否则 3-seed `mean` 变成跨体制混算

# ─────────────────────────────────────────────────────────────────────────────
# **A／B／C 组训练配方（`D-84` 裁定一 追认）＋ 「读法一」强制披露（条件 2）**
# ─────────────────────────────────────────────────────────────────────────────
group_recipe:
  source: "`D-84` 裁定一（`W5.6` 的 `P-3` 读法一 追认）"
  A: {augment: "off", curriculum: "off", cli: "--augment off --curriculum off", model_key: "llamaguard1b_A"}
  B: {augment: "on",  curriculum: "off", cli: "--augment on --curriculum off",  model_key: "llamaguard1b_B"}
  C: {augment: "on(OR)", curriculum: "on", cli: "--curriculum on", model_key: "llamaguard1b"}
  augment_or_semantics: "`--augment` 的**生效式 = `(--curriculum on) ∪ (--augment on)`**（OR 语义）⇒ `--curriculum on` 单独使用（C 组历史命令）**逐字不变**"
  ladder: "A→B→C 为**单因素阶梯**：A vs B 差「有无增强」；B vs C 差「有无课程调度」"
  regime_scope: "**仅 `id` 主体制 × A／B 各 3 seeds = 6 run**（`D-84` 裁定五：**不扩** `ood`；`v5 §5.6` 只要求 3 seeds）"

# ─────────────────────────────────────────────────────────────────────────────
