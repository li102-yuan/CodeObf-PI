# ─────────────────────────────────────────────────────────────────────────────
split_identity:
  enabled_by_flag: "--check-split-identity"
  rule: "所有消融组必须使用**完全相同**的数据集划分；**不得**每组随机重新划分"
  source: "SOURCE_LOCK/实验执行方案（最终版 v5）.md L624–L634（新增 32）；`PREREG_v1.md` §5 补录（G6）"
  fingerprint:
    method: "逐行 `text` 的 `sha256` 序列哈希"
    detail: "对喂入引擎的**实际 rows 序列**，逐行取 `sha256(text)`，再对拼接后的摘要串取 `sha256` ⇒ 序列**逐位**敏感（顺序变化也会变）"
    fields: [group, regime, seed, shard, n_records, n_pos, n_neg, fingerprint]
    empty_text_policy: "空 `text` 以 `sha256('')` 参与（不跳过，避免静默错位）"
  compare: "**同一 `(regime, shard)` 之内**，四组（含 D）须**逐位相同**（比对作用域由上方 `fields` 的 `regime`／`shard` 决定 ⇒ **跨体制／跨分片不作比对**）；任一不同 ⇒ **非零退出 ＋ 停工呈 W0**"
  on_mismatch: "nonzero_exit_and_stop_for_W0"
  artifact: "reports/eval/ablation_split_identity_v1.0_<ts>.csv"

# ─────────────────────────────────────────────────────────────────────────────
# C4 τ 口径：**不重寻**
# ─────────────────────────────────────────────────────────────────────────────
tau:
  per_run: true                    # **逐组逐 seed** 取该 run `best epoch` 的 `tau_ours`（全精度）
  full_precision: true             # `F-W5.1-2`：不取显示值
  source_field: "tau_ours"         # 读 `best.json` → ckpt `meta.json`
  parallel: 0.5                    # `0.5` 并列（`D-47` 裁定二／`D-53` 裁定三）
  reseek_forbidden: true           # **禁止**为让消融好看而统一 τ 或改 τ（会引入额外自由度 ⇒ 消融不可比）
  unify_forbidden: true            # **禁止**跨组统一 τ
  main_criterion: "主口径 = `0.5` **iff** `tau_main_override is True`，否则 = `tau_ours`（只读取与判定式应用，`05_01.resolve_tau_tracks`）"
  recompute_trigger_forbidden: true
  source_single: "05_01.resolve_tau_tracks（**禁**在 `05_06` 内重算或另寻）"

# ─────────────────────────────────────────────────────────────────────────────
# C7 指标与 C3 `mean ± std` 退化口径
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  primary: [tpr, fpr, f1, auroc]
  latency: [mean_ms, median_ms, p95_ms]
  memory: [load_peak_mib, infer_peak_mib]
  span_f1: "n/a"                   # Ours 为生成式二分类、无 span 输出 ⇒ **不适用**（非缺失）
  nan_rules:
    fpr_undefined_when: "n_neg == 0"
    auroc_undefined_when: "n_pos == 0 或 n_neg == 0"
    f1_undefined_when: "n_pos == 0（全负分片的 F1 无定义，不得读作 0）"
    render_as: "n/a"
  aggregate:
    mean_std: true                 # v5 L622；`D-47` 裁定四
    ddof: 1                        # 样本标准差（`W6.4`／`W6.9` 同口径）
    per_seed_raw_table: true       # 一律给逐 seed 原值表
    std_zero_declaration_slot: true
  std_zero:
    rule: "某格 `std = 0` ⇒ **显式声明退化**，**禁止**只写 `mean ± std`"
    declaration: "该格 3 个 seed 取值完全相同 ⇒ `std = 0`，属**退化**读数（非「方差小」）；不得据此声称稳定性。"
  variance_policy:
    source: "v5 L630–L634（新增 32）"
    rule: "多 seed 方差过大 ⇒ 检查训练／数据；调超参；**如实报告标准差，不强行追求小 std**"
    forbid: "**禁止**只报好看的 seed（`W6.7` §4-5）"

# ─────────────────────────────────────────────────────────────────────────────
# C6 记录数断言（取自 `W6.1` 的 detection.yaml，**禁改**）
# ─────────────────────────────────────────────────────────────────────────────
record_count_policy:
  source: "configs/eval/detection.yaml → record_assertions（**禁改**）"
  keys_in_scope: [regime_id_test, regime_ood_test, g3_hard_negative_test, id_val, ood_val]
  expected: {regime_id_test: 1583, regime_ood_test: 740, g3_hard_negative_test: 64, id_val: 1584, ood_val: 927}
  on_mismatch: "stop_and_escalate_W0（**禁改断言值**）"
  must_use: "csv.DictReader（经 05_01.read_records；封存 CSV 的 `text` 含换行 ⇒ 行数 ≠ 记录数）"
  line_regression: {records_expected: 1, lines_at_least: 3}

# ─────────────────────────────────────────────────────────────────────────────
# D 组载体分层（`--carrier-strata`）
# ─────────────────────────────────────────────────────────────────────────────
carrier:
  enabled_by_flag: "--carrier-strata"
  group_by_column: "carrier_type"
  values: [text, code]             # `DATA_CARD_CodeObf-PI_v1.0.md` §「`carrier_type`」行：`text`（载荷本体）／`code`（嵌入宿主代码后的完整文本）
  source: "DATA_CARD_CodeObf-PI_v1.0.md（`carrier_type` 字段说明行）"
  denominators:
    tpr: "该层内 `label==1` 的样本"
    fpr: "该层内 `label==0` 的样本"
    f1: "该层内正负样本并集"
  absent_layer_policy: "某层在该分片上 n=0 ⇒ **显式列出**且指标渲染 `n/a`（不静默省略、不填 0）"
  artifact: "reports/eval/ablation_carrier_v1.0_<ts>.csv"
  on_mismatch: "record_as_is_and_escalate_W0"

# ─────────────────────────────────────────────────────────────────────────────
# C5 输入面（实现期只读 val）
# ─────────────────────────────────────────────────────────────────────────────
input_policy:
  implementation_phase:
    allowed_source: [val]
    forbidden: ["data/sealed_test/**", "data/frozen/CodeObf-PI_v1.0/splits/*/test.csv"]
  formal_phase:
    allowed_source: [sealed]
    require: ["--split", "--access-log-note"]    # 缺一即拒绝执行并非零退出
  access_log_columns: [日期, 窗口, 用途, 命令, 输出路径, 复核人]
  script_writes_access_log: false                # 登记由**人**手工完成；脚本只回显 note

# ─────────────────────────────────────────────────────────────────────────────
# 声明句（**逐字**落报告；不得弱化、不得改写成中性表述）
# ─────────────────────────────────────────────────────────────────────────────
declarations:
  reading_disclosure:               # `D-84` 裁定一 **条件 2**（**强制显著披露**，逐字）
    - "**消融 B 组「普通随机增强」的读法声明**：`v5 §5.6` 字面为「**编码增强 ＋ 普通随机增强**」**两项**，本读法**合并为一项** —— 「普通随机增强」= 既有「编码感知增强」（`04_02.augment_attack`，二次编码、`p=0.30`、`ratio_cap=1.25`）在**无课程调度**下的随机施加形态，**不新造组件**。"
    - "**不得**声称该读法与 `v5` 字面**完全一致**；已写入 `PREREG` 补齐件（`D-84` 裁定一 条件 1／`D-85` 裁定一：须 `W1.1` 复核签署 ＋ tag `prereg-v1.7` 之后方可起跑）。"
  ab_not_trained:
    - "**A 组与 B 组的 ckpt 不存在**（`W6` 实测 `checkpoints/ours/` 无任何消融组目录），且其训练须由 **A5 侧**产出 ⇒ 本窗口（A6）**无权训练**。"
    - "本轮 A／B 两组的全部数字一律为 `<TBD>`，标注「**未训练／未就绪**」；**未**以任何形式用 C 组结果代替。"
  no_substitute:
    - "**禁止**伪造或外推 A／B 组数字；**禁止**用 C 组结果代替 A／B（`W6.7` §4-1）。"
  no_training:
    - "本窗口对 `04_01`／`04_02`／`04_03` 的**调用次数 = 0**；只做**推理评估**（C7）。"
  split_identity:
    - "所有消融组使用**完全相同**的数据集划分；**不得**每组随机重新划分（`v5 新增 32`）。"
  tau_not_reseek:
    - "τ **逐组逐 seed** 取该 run `best epoch` 的 `tau_ours`（全精度），`0.5` 并列；**未**为消融统一 τ、亦**未**重新寻优 τ。"
  std_zero:
    - "若某格 `std = 0` ⇒ 该格 3 个 seed 取值完全相同，属**退化**读数；已逐 seed 列出原值，**不得**据此声称稳定性。"
  variance:
    - "多 seed 方差过大时：**如实报告标准差，不强行追求小 std**（`v5 新增 32`）。"
  d_group:
    - "D 组按「**同一 ckpt × 按 `carrier_type` 分组评估**」实现（`W6.7` §1.3）⇒ **不需要新训练**；若 W0 改裁为「仅单载体训练的变体」则须先补训练。"

# ─────────────────────────────────────────────────────────────────────────────
# 产物与报告骨架（§6／§7.3）
# ─────────────────────────────────────────────────────────────────────────────
report:
  skeleton_sections:
    - "§1 概述与四组定义（v5 L612–L620 原文）"
    - "§2 消融总表（组 × 体制 × 指标 mean ± std）＋ 逐 seed 原值表 ＋ `std=0` 退化声明"
    - "§3 τ 口径（逐组逐 seed 的 `tau_ours` 全精度 ＋ 并列 0.5；**不重寻**声明）"
    - "§4 统一划分一致性（`--check-split-identity` 指纹表）"
    - "§5 载体分层（D 组；`--carrier-strata`）"
    - "§6 延迟与显存（与 `BASELINE_REPORT.md` §1 逐列同构；须带其 §12 口径注释）"
    - "§7 ACCESS_LOG 与冻结面复核"
    - "§8 局限与回退声明位"
    - "§9 回执／验收位（留给 W6 复核）"
    - "附 可直接搬入 `reports/eval/EVAL_REPORT.md` 的 §5.6 骨架段"
  artifacts:
    # P-2（`D-83` 裁定九·P-2）：**两档命名** —— 与本文件同源的声明须反映实际落盘命名。
    #   `--source sealed` ⇒ `ablation_v1.0_<ts>.{md,csv}`（**正式**）
    #   `--source val`    ⇒ `ablation_dryrun_val_v1.0_<ts>.{md,csv}`（**演练**；须与非权威稿自标规则一致，
    #                        `PROJECT_CONTRACT.md` §2-9）
    # 源码实现见 `scripts/eval/05_06_eval_ablation.py` 的 `cmd_eval()`：
    #   `name = "ablation" if source != "val" else "ablation_dryrun_val"`
    report_md: "reports/eval/ablation_v1.0_<ts>.md（正式）／ reports/eval/ablation_dryrun_val_v1.0_<ts>.md（演练）"
    report_csv: "reports/eval/ablation_v1.0_<ts>.csv（正式）／ reports/eval/ablation_dryrun_val_v1.0_<ts>.csv（演练）"
    split_identity_csv: "reports/eval/ablation_split_identity_v1.0_<ts>.csv"
    carrier_csv: "reports/eval/ablation_carrier_v1.0_<ts>.csv"
    per_sample_dir: "reports/eval/outputs/"
    log: "logs/eval/05_06_eval_ablation_<ts>.log"
  append_only: true                # C11：只追加，不覆盖

# ─────────────────────────────────────────────────────────────────────────────
# C10 引数带口径
# ─────────────────────────────────────────────────────────────────────────────
baseline_citation:
  rule: "引 `BASELINE_REPORT.md` 须带其 **§12 口径注释**"
  source: "reports/baseline/BASELINE_REPORT.md（tag `baseline-v1`）"
  rerun_forbidden: true            # C13：不重跑 B1–B5
