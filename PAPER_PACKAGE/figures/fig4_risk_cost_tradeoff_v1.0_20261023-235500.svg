    <text style="font-size: 6.4px; font-family: 'Times New Roman', 'Nimbus Roman', serif; fill: #555555" transform="translate(247.70216 272.836343)">A full trade-off curve would require a tau sweep (item #89-1), which is NOT approved.</text>
